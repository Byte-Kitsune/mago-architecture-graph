name: Release 1.2.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-1.2.0.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mago: ["1.50.0", "^1.50"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer update --with "carthage-software/mago:${{ matrix.mago }}" --no-interaction --prefer-dist --no-plugins --no-scripts
      - run: composer validate --strict --no-check-publish
      - run: composer audit --locked --format=plain
      - run: find src tests -name '*.php' -exec php -l {} \;
      - run: sh tests/smoke.sh
      - run: sh tests/inspection.sh
      - run: php tests/comment-metadata.php
      - run: sh tests/instance-smoke.sh
      - run: sh tests/requirements-smoke.sh
      - run: sh tests/namespace-smoke.sh
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish stable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          repo = os.environ['GH_REPO']
          sha = os.environ['RELEASE_SHA']
          def api(path, data=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and data is None:
                      return None
                  raise
          tag = api('/git/ref/tags/v1.2.0')
          if tag is None:
              tag = api('/git/refs', {'ref': 'refs/tags/v1.2.0', 'sha': sha})
          if tag['object']['type'] != 'commit' or tag['object']['sha'] != sha:
              raise RuntimeError('Existing v1.2.0 does not point to this verified commit')
          release = api('/releases/tags/v1.2.0')
          if release is None:
              release = api('/releases', {
                  'tag_name': 'v1.2.0', 'target_commitish': sha,
                  'name': '1.2.0', 'draft': False, 'prerelease': False,
                  'make_latest': 'true',
                  'body': 'Check same-namespace class references without imports by default. Constructor types, nullable and union types, construction, class constants and namespace-relative names now use the existing resolved class-reference coverage automatically.\n\nPolicies omitting dependency_mode can produce additional boundary findings. Set dependency_mode to imports to preserve the historical import-only behavior. Explicit layer permissions remain unchanged.\n\nTen neutral regression cases verify peer-entrypoint detection, declaration paths, duplicate suppression and allowed self/data references. Supports Mago >=1.50 and <2.0. The complete suite, strict Composer validation and locked audit run against the minimum and latest compatible Mago versions before publication.'})
          if release['draft'] or release['prerelease']:
              raise RuntimeError('Release is not published as stable')
          print(release['html_url'])
